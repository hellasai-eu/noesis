name: Feature Request
description: Propose a new feature for dianoisis
labels: ["feature"]
title: "[Feature] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description of the feature
      placeholder: What should this feature do?
    validations:
      required: true

  - type: dropdown
    id: user-role
    attributes:
      label: Target User Role
      description: Who is this feature for?
      options:
        - Student
        - Instructor
        - Admin
        - Super Admin
        - All Users
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: "As a [role], I want [capability] so that [benefit]"
      placeholder: "As an instructor, I want to..."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this feature to be complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Any implementation hints, affected areas, or constraints
      placeholder: Relevant components, edge functions, DB tables...
    validations:
      required: false

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      options:
        - Small (< 1 day)
        - Medium (1-3 days)
        - Large (> 3 days)
    validations:
      required: false
