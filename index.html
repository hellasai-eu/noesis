<!doctype html>
<!--
  The document shell, deliberately nameless.

  The title, the description and every social tag are written in at build time
  by the `inject-brand-head` plugin in `vite.config.ts`, from the branding
  overlay's `brand.meta.json`. This repository holds no product identity, so
  there is nothing to hardcode here — and the two empty attributes below are
  the plugin's substitution points, not an oversight. Editing this file to name
  a product would put that name somewhere no deployment can override.
-->
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
