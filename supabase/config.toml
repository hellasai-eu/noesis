[db.seed]
# Run seed.sql on every Supabase branch (local reset + preview branches).
# seed.sql creates the local test accounts (e2e-*@test.local / testpass123).
#
# sql_paths entries are resolved relative to this file's directory (supabase/),
# so "seed.sql" → supabase/seed.sql. This is the standard Supabase CLI
# convention and matches what `supabase db reset` uses locally.
enabled = true
sql_paths = ["seed.sql"]

[api]
enabled = true

# Opt-in TOTP MFA (authenticator apps). Hosted production has TOTP enabled by
# default and is dashboard-managed; this block pins the same behaviour for the
# local stack and preview branches so the enroll/challenge flows and the
# mfa-totp E2E spec work there too. Phone/SMS factors stay off.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# JWT verification is disabled at the gateway for every function below but the
# first, so an unauthenticated request reaches the handler and the handler's own
# check is the only access boundary. Not all of them have one — supabase/functions/AUTHORIZATION.md
# records which do, and #1135/#1136/#1137 track closing the rest.
#
# Turning this back on is not the fix: the anon key ships in the frontend bundle
# and satisfies the gateway check, so it gates nothing. See AUTHORIZATION.md.

# The one function without an explicit setting until now: it inherited the CLI
# default of true, so unlike every other function it does have a gateway check.
# Stated here so the exception is visible rather than inferred from an absence.
# Its only caller is the browser (AcademicYearRolloverDialog), which always
# sends a session JWT, so this is the behaviour that was already deployed.
[functions.academic-year-rollover]
verify_jwt = true

[functions.accept-invitation]
verify_jwt = false

[functions.admin-reset-user-mfa]
verify_jwt = false

